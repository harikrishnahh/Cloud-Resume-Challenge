name: Deploy Backend

on:
  push:
    branches: [master]
    paths:
      - 'backend/**'

defaults:
  run:
    working-directory: ./backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 pytest

      - name: Run tests
        run: pytest test_lambda.py -v